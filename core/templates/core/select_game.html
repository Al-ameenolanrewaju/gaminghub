<!-- core/templates/core/select_game.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Select Game</title>
    <style>
        .games-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
        .game-card { border: 2px solid #ddd; padding: 20px; text-align: center; border-radius: 10px; }
        .game-card:hover { border-color: #007bff; }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .btn { display: inline-block; margin: 5px; padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .btn-submit { background: #28a745; }
    </style>
</head>
<body>
    <h1>🎮 Select Your Game</h1>

    <div class="games-grid">
        {% for game in games %}
        <div class="game-card">
            <div class="game-icon">{{ game.icon }}</div>
            <h3>{{ game.name }}</h3>
            <div>
                <a href="{% url game.submit_url %}" class="btn btn-submit">📤 Submit Stats</a>
                <a href="{% url game.leaderboard_url %}" class="btn">🏆 View Leaderboard</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
