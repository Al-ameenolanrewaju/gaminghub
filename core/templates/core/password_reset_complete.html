<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Complete - Gaming Hub</title>
    <style>
        /* SAME CSS AS LOGIN PAGE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar {
            background: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #3b82f6;
        }
        .logo { font-size: 1.8rem; font-weight: bold; color: #60a5fa; text-decoration: none; }

        .container {
            max-width: 500px;
            margin: 3rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .auth-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 2.5rem;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-title {
            font-size: 2rem;
            color: #60a5fa;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .success-card {
            background: #065f46;
            color: #a7f3d0;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            border-left: 4px solid #10b981;
            text-align: center;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .btn {
            background: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            font-weight: 500;
            margin-top: 1rem;
        }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🎮 ULTIMATE GAMING HUB</a>
        <a href="{% url 'login' %}" class="btn" style="width: auto;">← Back to Login</a>
    </nav>

    <div class="container">
        <div class="auth-card">
            <div class="success-card">
                <div class="success-icon">✅</div>
                <h2 style="color: #a7f3d0; margin-bottom: 1rem;">Password Reset Complete!</h2>
                <p style="color: #d1fae5;">
                    Your password has been set successfully. You can now login with your new password.
                </p>
            </div>

            <a href="{% url 'login' %}" class="btn">🎮 Login Now</a>
        </div>
    </div>
</body>
</html>
