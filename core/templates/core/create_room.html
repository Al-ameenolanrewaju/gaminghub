<!-- core/templates/core/create_room.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Create Room - Gaming Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 40px;
            border: 2px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .form-container {
            display: grid;
            gap: 25px;
        }

        .form-section {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #475569;
        }

        .section-title {
            font-size: 1.3rem;
            color: #60a5fa;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
        }

        select.form-control {
            appearance: none;
            cursor: pointer;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
        }

        .radio-label {
            display: block;
            padding: 15px;
            background: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option input:checked + .radio-label {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .radio-label:hover {
            border-color: #60a5fa;
        }

        .radio-icon {
            font-size: 1.8rem;
            margin-bottom: 5px;
            display: block;
        }

        .player-slider {
            margin-top: 15px;
        }

        .slider-container {
            position: relative;
            height: 40px;
            margin: 20px 0;
        }

        .slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #334155;
            border-radius: 4px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-values {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #94a3b8;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #475569;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            border-color: #60a5fa;
            color: #60a5fa;
        }

        .password-note {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .game-icon-preview {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .preview-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #475569;
            margin-top: 20px;
        }

        .preview-title {
            font-size: 1.2rem;
            color: #60a5fa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Create Gaming Room</h1>
            <p>Host a room and invite players to join your game session</p>
        </div>

        <!-- Add this to your home.html -->
<div style="text-align: center; margin: 2rem 0;">
    <a href="{% url 'room_list' %}" class="btn"
       style="background: linear-gradient(90deg, #3b82f6, #60a5fa);
              color: white; padding: 1rem 2rem; font-size: 1.2rem;
              text-decoration: none; border-radius: 10px;
              display: inline-block; margin: 1rem;">
        🎮 Browse All Game Rooms →
    </a>
</div>

        <form method="post" class="form-container">
            {% csrf_token %}

            <!-- Room Details Section -->
            <div class="form-section">
                <h2 class="section-title">📝 Room Details</h2>
                <div class="form-group">
                    <label class="form-label">Room Title</label>
                    <input type="text" name="title" class="form-control"
                           placeholder="e.g., Competitive FIFA 24 Tournament"
                           required maxlength="100">
                </div>

                <div class="form-group">
                    <label class="form-label">Description (Optional)</label>
                    <textarea name="description" class="form-control"
                              placeholder="Describe your room, rules, or requirements..."></textarea>
                </div>
            </div>

            <!-- Game Settings Section -->
            <div class="form-section">
                <h2 class="section-title">🎯 Game Settings</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Select Game</label>
                        <div class="select-wrapper">
                            <select name="game" class="form-control" required>
                                <option value="">Choose a game...</option>
                                <option value="FIFA">🎮 FIFA</option>
                                <option value="COD">🔫 Call of Duty</option>
                                <option value="FORTNITE">🏹 Fortnite</option>
                                <option value="VALORANT">💥 Valorant</option>
                                <option value="APEX">⚡ Apex Legends</option>
                                <option value="LOL">👑 League of Legends</option>
                                <option value="CSGO">🎯 CS:GO</option>
                                <option value="MINECRAFT">⛏️ Minecraft</option>
                                <option value="ROCKET_LEAGUE">🚗 Rocket League</option>
                                <option value="OVERWATCH">🛡️ Overwatch</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Game Mode</label>
                        <div class="radio-grid">
                            <div class="radio-option">
                                <input type="radio" name="game_mode" value="CASUAL" id="mode_casual" checked>
                                <label class="radio-label" for="mode_casual">
                                    <span class="radio-icon">😌</span>
                                    Casual
                                </label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="game_mode" value="COMPETITIVE" id="mode_competitive">
                                <label class="radio-label" for="mode_competitive">
                                    <span class="radio-icon">🏆</span>
                                    Competitive
                                </label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="game_mode" value="TOURNAMENT" id="mode_tournament">
                                <label class="radio-label" for="mode_tournament">
                                    <span class="radio-icon">🏅</span>
                                    Tournament
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Maximum Players</label>
                    <div class="slider-container">
                        <input type="range" name="max_players" class="slider"
                               min="2" max="16" step="2" value="10"
                               oninput="document.getElementById('player-count').textContent = this.value">
                    </div>
                    <div class="slider-values">
                        <span>2</span>
                        <span id="player-count">10</span> players
                        <span>16</span>
                    </div>
                </div>
            </div>

            <!-- Privacy & Schedule Section -->
            <div class="form-section">
                <h2 class="section-title">🔒 Privacy & Schedule</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Room Privacy</label>
                        <div class="radio-grid">
                            <div class="radio-option">
                                <input type="radio" name="privacy" value="PUBLIC" id="privacy_public" checked>
                                <label class="radio-label" for="privacy_public">
                                    <span class="radio-icon">🌍</span>
                                    Public
                                </label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="privacy" value="PRIVATE" id="privacy_private">
                                <label class="radio-label" for="privacy_private">
                                    <span class="radio-icon">🔒</span>
                                    Private
                                </label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="privacy" value="FRIENDS" id="privacy_friends">
                                <label class="radio-label" for="privacy_friends">
                                    <span class="radio-icon">👥</span>
                                    Friends
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Start Time</label>
                        <input type="datetime-local" name="start_time" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Room Password (Optional)</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Leave empty for no password">
                    <p class="password-note">Only required for private rooms</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <a href="{% url 'room_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">🚀 Create Room</button>
            </div>
        </form>
    </div>

    <script>
        // Update preview when game is selected
        document.querySelector('select[name="game"]').addEventListener('change', function() {
            const gameIcons = {
                'FIFA': '🎮',
                'COD': '🔫',
                'FORTNITE': '🏹',
                'VALORANT': '💥',
                'APEX': '⚡',
                'LOL': '👑',
                'CSGO': '🎯',
                'MINECRAFT': '⛏️',
                'ROCKET_LEAGUE': '🚗',
                'OVERWATCH': '🛡️'
            };
            const icon = gameIcons[this.value] || '🎮';
            // You could update a preview element here
        });

        // Form validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const title = document.querySelector('input[name="title"]').value.trim();
            const game = document.querySelector('select[name="game"]').value;
            const startTime = document.querySelector('input[name="start_time"]').value;

            if (!title) {
                e.preventDefault();
                alert('Please enter a room title');
                return false;
            }

            if (!game) {
                e.preventDefault();
                alert('Please select a game');
                return false;
            }

            if (!startTime) {
                e.preventDefault();
                alert('Please select a start time');
                return false;
            }

            return true;
        });
    </script>
</body>
</html>
