<!DOCTYPE html>
<html>
<head>
    <title>FIFA Mobile Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 20px;
            border: 2px solid #334155;
        }

        .game-icon {
            font-size: 5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .stats-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .stat-box {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #475569;
            text-align: center;
            min-width: 150px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .leaderboard-table {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #334155;
            margin-bottom: 30px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 80px 1fr repeat(5, 120px);
            background: #1e293b;
            padding: 15px 20px;
            font-weight: bold;
            color: #cbd5e1;
            border-bottom: 2px solid #334155;
        }

        .table-row {
            display: grid;
            grid-template-columns: 80px 1fr repeat(5, 120px);
            padding: 15px 20px;
            align-items: center;
            border-bottom: 1px solid #334155;
            transition: background 0.3s;
        }

        .table-row:hover {
            background: rgba(96, 165, 250, 0.1);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .rank {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
        }

        .rank-1 { color: #fbbf24; }
        .rank-2 { color: #cbd5e1; }
        .rank-3 { color: #f59e0b; }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            background: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .player-name {
            font-weight: 500;
        }

        .you-badge {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .stat-cell {
            text-align: center;
            font-weight: 500;
        }

        .score {
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .actions {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-submit {
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: #475569;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: #64748b;
        }
        /* Add to your CSS */
.form-group input[type="file"] {
    width: 100%;
    padding: 10px;
    background: #1e293b;
    border: 2px dashed #475569;
    border-radius: 8px;
    color: #cbd5e1;
}

.form-group input[type="file"]::file-selector-button {
    background: #475569;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    margin-right: 10px;
    cursor: pointer;
}

textarea {
    width: 100%;
    padding: 12px;
    background: #1e293b;
    border: 2px solid #475569;
    border-radius: 8px;
    color: white;
    font-family: inherit;
}
    </style>
</head>
<body>



    <!-- Add screenshot field -->
    <div class="form-group">
        <label for="screenshot">📸 Upload Screenshot</label>
        <input type="file" id="screenshot" name="screenshot" accept="image/*" required>
        <small>Upload a screenshot of your game stats as proof</small>
    </div>

    <!-- Add description field -->
    <div class="form-group">
        <label for="description">📝 Notes (Optional)</label>
        <textarea id="description" name="description" rows="3" placeholder="Any additional information about your stats..."></textarea>
    </div>

    <!-- Rest of your form... -->
</form>

        <div class="actions">
            <a href="/submit/fifa/" class="btn btn-submit">📤 Submit Your Stats</a>
            <a href="/games/" class="btn">🎮 All Games</a>
        </div>
        <!-- In ALL submit HTML files (fifa.html, pubg.html, etc.) -->


        <div class="navigation">
            <a href="/" class="nav-btn">🏠 Home</a>
            <a href="/dashboard/" class="nav-btn">📊 Dashboard</a>
            <a href="/profile/" class="nav-btn">👤 Profile</a>
            <a href="/games/" class="nav-btn">← Back to Games</a>
        </div>
    </div>
</body>
</html>
