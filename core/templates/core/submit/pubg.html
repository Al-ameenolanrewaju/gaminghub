<!DOCTYPE html>
<html>
<head>
    <title>Submit PUBG Mobile Stats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a202c 100%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border: 2px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #10b981, #34d399);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .nav-link {
            color: #60a5fa;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="game-header">
            <div class="game-icon">🔫</div>
            <h1>Submit PUBG Mobile Stats</h1>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="wins">🏆 Wins</label>
                <input type="number" id="wins" name="wins" min="0" required>
            </div>

            <div class="form-group">
                <label for="matches_played">🎮 Matches Played</label>
                <input type="number" id="matches_played" name="matches_played" min="0" required>
            </div>

            <div class="form-group">
                <label for="kills">🔫 Kills</label>
                <input type="number" id="kills" name="kills" min="0" required>
            </div>

            <div class="form-group">
                <label for="deaths">💀 Deaths</label>
                <input type="number" id="deaths" name="deaths" min="0">
            </div>

            <div class="form-group">
                <label for="chicken_dinners">🍗 Chicken Dinners</label>
                <input type="number" id="chicken_dinners" name="chicken_dinners" min="0">
            </div>

            <div class="form-group">
                <label for="survival_time">⏱ Survival Time (minutes)</label>
                <input type="number" id="survival_time" name="survival_time" min="0">
            </div>

            <div class="form-group">
                <label for="screenshot">📸 Screenshot (Required)</label>
                <input type="file" id="screenshot" name="screenshot" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="description">📝 Notes</label>
                <textarea id="description" name="description" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-submit">📤 Submit Stats</button>
        </form>

        <div class="navigation">
            <a href="/games/" class="nav-link">← Back to Games</a>
            <a href="/leaderboards/pubg/" class="nav-link">View Leaderboard →</a>
        </div>
    </div>
</body>
</html>
