<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .game {
            padding: 10px;
            margin: 5px;
            border: 2px solid #ccc;
            display: inline-block;
            cursor: pointer;
        }
        .selected {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Simple Game Selection Test</h1>

    <form method="POST">
        {% csrf_token %}

        <h3>Click games to select (max 5):</h3>
        <div id="games">
            {% for game in games %}
            <div class="game" data-id="{{ game.id }}">
                {{ game.id }}: {{ game.name }}
            </div>
            {% empty %}
            <p>No games in database!</p>
            {% endfor %}
        </div>

        <input type="hidden" name="favorite_games" id="favInput">

        <p>Selected: <span id="count">0</span>/5</p>

        <button type="submit">Submit</button>
    </form>

    <script>
        let selected = [];
        const max = 5;

        // Initialize with current selections
        {% for id in selected_ids %}
            selected.push("{{ id }}");
            console.log("Pre-selected ID: {{ id }}");
        {% endfor %}

        function update() {
            // Update counter
            document.getElementById('count').textContent = selected.length;

            // Update hidden input
            document.getElementById('favInput').value = selected.join(',');
            console.log("Hidden input value:", document.getElementById('favInput').value);

            // Update visual selection
            document.querySelectorAll('.game').forEach(game => {
                const id = game.getAttribute('data-id');
                if (selected.includes(id)) {
                    game.classList.add('selected');
                } else {
                    game.classList.remove('selected');
                }
            });
        }

        // Add click handlers
        document.querySelectorAll('.game').forEach(game => {
            game.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                console.log("Clicked game ID:", id);

                const index = selected.indexOf(id);

                if (index > -1) {
                    // Remove if already selected
                    selected.splice(index, 1);
                    console.log("Deselected:", id);
                } else {
                    // Add if under limit
                    if (selected.length < max) {
                        selected.push(id);
                        console.log("Selected:", id);
                    } else {
                        alert("Max 5 games allowed!");
                        return;
                    }
                }

                update();
            });
        });

        // Initial update
        update();
        console.log("Initial selected IDs:", selected);
    </script>
</body>
</html>
