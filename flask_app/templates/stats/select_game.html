{% extends "base.html" %}
{% block title %}Select a game · Gaming Hub{% endblock %}
{% block content %}
<section class="hero">
    <h1>Choose a game</h1>
    <p>Submit your stats or browse verified results.</p>
</section>
<div class="grid">
    {% for slug, game in games.items() %}
    <article class="card">
        <h2>{{ game.icon }} {{ game.name }}</h2>
        <p><a class="button" href="{{ url_for('stats.submit_stats', game_slug=slug) }}">Submit stats</a></p>
        <p><a href="{{ url_for('stats.leaderboard', game_slug=slug) }}">View leaderboard</a></p>
    </article>
    {% endfor %}
</div>
{% endblock %}
