{% extends "base.html" %}
{% block title %}Choose a new password · Gaming Hub{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Choose a new password</h1>
    {% for error in errors %}<p role="alert">{{ error }}</p>{% endfor %}
    {% if valid %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label>New password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label></p>
        <p><label>Confirm password <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password"></label></p>
        <button class="button" type="submit">Update password</button>
    </form>
    {% else %}
    <p><a href="{{ url_for('auth_rooms.password_reset') }}">Request another reset link</a></p>
    {% endif %}
</section>
{% endblock %}
